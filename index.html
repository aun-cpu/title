<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer - Move & Camera Only</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #1a1a1a;
        touch-action: none;
    }
    #app-stage {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        transform-origin: left top;
        z-index: 1;
    }
    body.force-rotate #app-stage {
        top: 0;
        left: 100%;
        width: 100vh;
        height: 100vw;
        transform: rotate(90deg);
    }
    #canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }
    #canvas-container canvas {
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
    }
    #joystick-container {
        position: absolute;
        left: 30px;
        bottom: 30px;
        width: 150px;
        height: 150px;
        z-index: 20;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        display: none;
    }
    #joystick-base {
        position: absolute;
        left: 0;
        top: 0;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.35);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #joystick-stick {
        position: absolute;
        left: 52px;
        top: 52px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.65);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
        transform: translate(0px, 0px);
    }
    #title-image {
        width: min(135vw, 1500px);
        height: auto;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
    }

    #start-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 50;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 5%;
        transition: opacity 0.5s ease;
        opacity: 1;
        pointer-events: none;
    }
    #start-screen.is-hidden {
        opacity: 0;
        pointer-events: none;
    }
    #start-button,
    #chapter-button {
        margin-top: 24px;
        padding: 0;
        background: transparent;
        border: none;
        color: #ffffff;
        font-family: 'Press Start 2P', 'MS Gothic', monospace;
        font-size: 20px;
        letter-spacing: 0.1em;
        text-shadow: 3px 3px 0 #000;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        pointer-events: auto;
        animation: start-button-blink 1s steps(1, end) infinite;
    }
    #chapter-button {
        margin-top: 16px;
    }
    #start-button:active,
    #chapter-button:active {
        transform: scale(0.95);
    }
    @keyframes start-button-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.35; }
    }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

<div id="app-stage">
    <div id="canvas-container"></div>

    <div id="joystick-container">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>

    <div id="start-screen">
        <img id="title-image" src="./title.png" alt="">
        <button id="start-button">&gt;From the start</button>
        <button id="chapter-button">&gt;select chapter</button>
    </div>
</div>

<script>
    // ============================================================
    // 画面の向き制御
    // ============================================================

    function isPortraitDevice() {
        return window.innerWidth < window.innerHeight;
    }

    function getLogicalWidth() {
        return isPortraitDevice()
            ? window.innerHeight
            : window.innerWidth;
    }

    function getLogicalHeight() {
        return isPortraitDevice()
            ? window.innerWidth
            : window.innerHeight;
    }

    function getLogicalX(clientX, clientY) {
        return isPortraitDevice() ? clientY : clientX;
    }

    function getLogicalY(clientX, clientY) {
        return isPortraitDevice()
            ? window.innerWidth - clientX
            : clientY;
    }

    function updateForceRotateClass() {
        if (isPortraitDevice()) {
            document.body.classList.add('force-rotate');
        } else {
            document.body.classList.remove('force-rotate');
        }
    }

    updateForceRotateClass();


    // ============================================================
    // Three.js 基本設定
    // ============================================================

    const scene = new THREE.Scene();

    const bgGroup = new THREE.Group();
    scene.add(bgGroup);

    const camera = new THREE.PerspectiveCamera(
        75,
        getLogicalWidth() / getLogicalHeight(),
        0.1,
        1000
    );

    const renderer = new THREE.WebGLRenderer({
        antialias: false,
        powerPreference: 'default',
        failIfMajorPerformanceCaveat: false,
        preserveDrawingBuffer: false
    });


    // ============================================================
    // ピクセルアート風レンダリング
    // ============================================================

    const pixelationScale = 1.7;

    let posterizeCanvas = null;
    let posterizeCtx = null;

    function applyPixelatedRendererSize() {
        const displayWidth = getLogicalWidth();
        const displayHeight = getLogicalHeight();

        const lowResWidth = Math.max(
            1,
            Math.floor(displayWidth / pixelationScale)
        );

        const lowResHeight = Math.max(
            1,
            Math.floor(displayHeight / pixelationScale)
        );

        renderer.setPixelRatio(1);
        renderer.setSize(lowResWidth, lowResHeight, false);

        if (!posterizeCanvas) {
            posterizeCanvas = document.createElement('canvas');

            posterizeCanvas.style.imageRendering = 'pixelated';
            posterizeCanvas.style.position = 'absolute';
            posterizeCanvas.style.top = '0';
            posterizeCanvas.style.left = '0';

            posterizeCtx = posterizeCanvas.getContext(
                '2d',
                { alpha: false }
            );

            if (!posterizeCtx) {
                console.warn(
                    '2D canvas context could not be created.'
                );
                return;
            }

            posterizeCtx.imageSmoothingEnabled = false;

            document
                .getElementById('canvas-container')
                .appendChild(posterizeCanvas);
        }

        posterizeCanvas.width = lowResWidth;
        posterizeCanvas.height = lowResHeight;

        posterizeCanvas.style.width =
            displayWidth + 'px';

        posterizeCanvas.style.height =
            displayHeight + 'px';

        posterizeCanvas.style.filter =
            'contrast(1.08) saturate(1.15)';
    }

    applyPixelatedRendererSize();

    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const cappedAnisotropy = Math.min(
        4,
        renderer.capabilities.getMaxAnisotropy()
    );


    // ============================================================
    // 地面当たり判定
    // ============================================================

    const groundRaycaster = new THREE.Raycaster();

    const groundRayDirection =
        new THREE.Vector3(0, -1, 0);

    const groundRayOrigin =
        new THREE.Vector3();

    const groundOffset = 0.0;
    const terrainProbeHeight = 20.0;
    const maxStepHeight = 0.5;

    const maxWalkableSlopeAngle =
        THREE.MathUtils.degToRad(50);

    const upVector =
        new THREE.Vector3(0, 1, 0);


    function probeGroundHeight(x, z, referenceY) {

        if (
            !bgGroup ||
            bgGroup.children.length === 0
        ) {
            return null;
        }

        groundRayOrigin.set(
            x,
            referenceY + terrainProbeHeight,
            z
        );

        groundRaycaster.set(
            groundRayOrigin,
            groundRayDirection
        );

        const hits =
            groundRaycaster.intersectObject(
                bgGroup,
                true
            );

        if (hits.length === 0) {
            return null;
        }

        for (let i = 0; i < hits.length; i++) {

            if (
                hits[i].point.y <=
                referenceY + maxStepHeight
            ) {
                return hits[i];
            }
        }

        return null;
    }


    function isTooSteep(hit) {

        if (!hit || !hit.face) {
            return false;
        }

        const worldNormal =
            hit.face.normal
                .clone()
                .transformDirection(
                    hit.object.matrixWorld
                );

        const slopeAngle =
            worldNormal.angleTo(upVector);

        return slopeAngle >
            maxWalkableSlopeAngle;
    }


    function updateGroundCollision() {

        if (
            !targetModel ||
            !bgGroup ||
            bgGroup.children.length === 0
        ) {
            return;
        }

        const hit =
            probeGroundHeight(
                targetModel.position.x,
                targetModel.position.z,
                targetModel.position.y
            );

        if (!hit) return;

        if (isTooSteep(hit)) return;

        targetModel.position.y =
            hit.point.y + groundOffset;
    }


    // ============================================================
    // ズーム無効化
    // ============================================================

    let lastTouchEndTime = 0;

    document.addEventListener(
        'touchend',
        function (e) {

            const now = Date.now();

            if (
                now - lastTouchEndTime <= 350
            ) {
                e.preventDefault();
            }

            lastTouchEndTime = now;

        },
        { passive: false }
    );

    document.addEventListener(
        'dblclick',
        function (e) {
            e.preventDefault();
        },
        { passive: false }
    );

    document.addEventListener(
        'gesturestart',
        function (e) {
            e.preventDefault();
        }
    );

    document.addEventListener(
        'gesturechange',
        function (e) {
            e.preventDefault();
        }
    );

    document.addEventListener(
        'gestureend',
        function (e) {
            e.preventDefault();
        }
    );

    document.addEventListener(
        'touchmove',
        function (e) {

            if (e.touches.length > 1) {
                e.preventDefault();
            }

        },
        { passive: false }
    );


    // ============================================================
    // WebGLコンテキストロスト対策
    // ============================================================

    let isRendererContextLost = false;

    renderer.domElement.addEventListener(
        'webglcontextlost',
        function (e) {

            e.preventDefault();

            isRendererContextLost = true;

            console.warn(
                'WebGLコンテキストが失われました。復帰を待機します。'
            );

        },
        false
    );

    renderer.domElement.addEventListener(
        'webglcontextrestored',
        function () {

            isRendererContextLost = false;

            if (typeof clock !== 'undefined') {
                clock.getDelta();
            }

            console.info(
                'WebGLコンテキストが復帰しました。'
            );

        },
        false
    );


    // ============================================================
    // ライト
    // ============================================================

    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            0.3
        )
    );

    const dirLight =
        new THREE.DirectionalLight(
            0xffffff,
            2.6
        );

    dirLight.position.set(
        5,
        10,
        7.5
    );

    dirLight.castShadow = true;

    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;

    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;

    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;

    dirLight.shadow.bias = -0.0005;

    scene.add(dirLight);


    const fillLight =
        new THREE.DirectionalLight(
            0xffffff,
            1.0
        );

    fillLight.position.set(
        -5,
        5,
        -7
    );

    scene.add(fillLight);


    // ============================================================
    // 環境マップ
    // ============================================================

    const pmremGenerator =
        new THREE.PMREMGenerator(renderer);

    const environmentScene =
        new THREE.Scene();

    environmentScene.background =
        new THREE.Color(0x202020);

    const environmentLight =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2
        );

    environmentScene.add(environmentLight);

    const environmentTarget =
        pmremGenerator.fromScene(
            environmentScene
        );

    scene.environment =
        environmentTarget.texture;


    // ============================================================
    // カメラ設定
    // ============================================================

    const targetHeightOffset = 1.5;

    const cameraDistance = 1.6;

    // タイトル画面専用のカメラ距離
    // START前だけ通常よりカメラを引く
    const titleCameraDistance = 1.7;

    // タイトル画面でct1を画面右寄りに映すための
    // 注視点のずらし量（大きいほど右端に寄る）
    const titleRightEdgeOffset = 1.3;

    // タイトル画面でct1を見る注視点を下げる量
    // （カメラの位置自体は動かさない）
    const titleLookAtDrop = 0.5;

    // ct1のローカル前方軸の符号（モデルの向きに合わせて調整）
    // 1なら(0,0,1)、-1なら(0,0,-1)が正面方向
    const modelForwardSign = 1;

    const initialLeftYawOffset =
        Math.PI / 2;

    let cameraSpherical =
        new THREE.Spherical(
            cameraDistance,
            Math.PI / 2.2,
            initialLeftYawOffset
        );

    const minPolarAngle = 0.1;

    const maxPolarAngle =
        Math.PI / 2 - 0.05;


    // ============================================================
    // モデル・アニメーション
    // ============================================================

    let targetModel = null;
    let bgModel = null;
    let catModel = null;

    let mixer = null;
    let catMixer = null;

    let actions = {};

    let currentAction = null;

    // ctの右側にcat.glbを配置する距離
    const catOffsetFromCt = 2;

    // catの高さ調整（プラスで上、マイナスで下）
    const catHeightOffset = 0.55;

    const animationFPS = 30;

    const clock = new THREE.Clock();


    // ============================================================
    // スタート画面
    // ============================================================

    let gameStarted = false;

    const startScreenElement =
        document.getElementById(
            'start-screen'
        );

    const startButtonElement =
        document.getElementById(
            'start-button'
        );


    startButtonElement.addEventListener(
        'click',
        () => {

            if (gameStarted) return;

            gameStarted = true;

            if (startScreenElement) {

                startScreenElement.classList.add(
                    'is-hidden'
                );

                setTimeout(() => {

                    if (
                        startScreenElement.parentNode
                    ) {
                        startScreenElement.parentNode
                            .removeChild(
                                startScreenElement
                            );
                    }

                }, 500);
            }

            if (joystickContainer) {
                joystickContainer.style.display =
                    'block';
            }

            setAction('idle');

            // STARTを押した瞬間に
            // 通常のカメラ位置へ戻す
            updateCameraPosition();
        }
    );


    // ============================================================
    // 移動・カメラ設定
    // ============================================================

    const maxMoveSpeed = 4.0;

    const rotationSpeed = 10.0;

    const cameraTouchSensitivity = 0.005;


    // ============================================================
    // GLTF Loader
    // ============================================================

    const loader =
        new THREE.GLTFLoader();


    // ============================================================
    // 背景モデル
    // ============================================================

    function setupBgMaterials(bgScene) {

        bgScene.traverse((child) => {

            if (!child.isMesh) return;

            const oldMaterial =
                child.material;

            const materials =
                Array.isArray(oldMaterial)
                    ? oldMaterial
                    : [oldMaterial];

            const newMaterials =
                materials.map((material) => {

                    if (material.map) {

                        material.map.encoding =
                            THREE.sRGBEncoding;

                        material.map.anisotropy =
                            cappedAnisotropy;

                        material.map.needsUpdate =
                            true;
                    }

                    return new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        wireframe: false,
                        transparent: true,
                        opacity: 0.99,
                        map: material.map || null,
                        vertexColors:
                            material.vertexColors
                    });

                });

            child.material =
                Array.isArray(oldMaterial)
                    ? newMaterials
                    : newMaterials[0];

            child.receiveShadow = true;

            child.frustumCulled = true;

            if (child.geometry) {

                if (!child.geometry.boundingSphere) {
                    child.geometry.computeBoundingSphere();
                }

                if (!child.geometry.boundingBox) {
                    child.geometry.computeBoundingBox();
                }
            }

        });
    }


    function loadBgModel() {

        loader.load(
            './bgti1.glb',

            function (gltf) {

                try {

                    const partScene =
                        gltf.scene;

                    partScene.scale.set(
                        1,
                        1,
                        1
                    );

                    setupBgMaterials(
                        partScene
                    );

                    bgGroup.add(
                        partScene
                    );

                    registerBgCullingPart(
                        partScene
                    );

                } catch (setupError) {

                    console.error(
                        'bgti1.glb のセットアップエラー:',
                        setupError
                    );
                }

                bgModel = bgGroup;

                loadCt1Model();

            },

            undefined,

            function (error) {

                console.error(
                    'bgti1.glb の読み込みエラー:',
                    error
                );

                loadCt1Model();
            }
        );
    }

    loadBgModel();


    // ============================================================
    // 背景パーツの視錐台カリング
    // ============================================================

    const bgCullingParts = [];

    const bgCullingFrustum =
        new THREE.Frustum();

    const bgCullingProjScreenMatrix =
        new THREE.Matrix4();

    const bgCullingMargin = 2.0;


    function registerBgCullingPart(
        partScene
    ) {

        const box =
            new THREE.Box3()
                .setFromObject(
                    partScene
                );

        if (box.isEmpty()) return;

        const sphere =
            new THREE.Sphere();

        box.getBoundingSphere(
            sphere
        );

        sphere.radius +=
            bgCullingMargin;

        bgCullingParts.push({
            object: partScene,
            sphere: sphere
        });
    }


    function updateBgFrustumCulling() {

        if (
            bgCullingParts.length === 0
        ) {
            return;
        }

        bgCullingProjScreenMatrix
            .multiplyMatrices(
                camera.projectionMatrix,
                camera.matrixWorldInverse
            );

        bgCullingFrustum
            .setFromProjectionMatrix(
                bgCullingProjScreenMatrix
            );

        for (
            let i = 0;
            i < bgCullingParts.length;
            i++
        ) {

            const part =
                bgCullingParts[i];

            part.object.visible =
                bgCullingFrustum
                    .intersectsSphere(
                        part.sphere
                    );
        }
    }


    // ============================================================
    // ct1モデル
    // ============================================================

    function loadCt1Model() {

        loader.load(
            './ct1.glb',

            function (gltf) {

                targetModel =
                    gltf.scene;

                targetModel.position.x -= 5;
                targetModel.position.z -= 5.3;

                targetModel.rotation.y =
                    initialLeftYawOffset;


                targetModel.traverse(
                    (child) => {

                        if (!child.isMesh) {
                            return;
                        }

                        const materials =
                            Array.isArray(
                                child.material
                            )
                                ? child.material
                                : [child.material];

                        materials.forEach(
                            (material) => {

                                if (!material) {
                                    return;
                                }

                                if (material.color) {

                                    material.color
                                        .multiplyScalar(
                                            0.4
                                        );
                                }

                                material.metalness =
                                    0.0;

                                material.roughness =
                                    0.95;

                                material.envMapIntensity =
                                    0.08;

                                if (material.map) {

                                    material.map.encoding =
                                        THREE.sRGBEncoding;

                                    material.map.anisotropy =
                                        cappedAnisotropy;

                                    material.map.needsUpdate =
                                        true;
                                }

                                material.needsUpdate =
                                    true;
                            }
                        );

                        child.castShadow = true;
                        child.receiveShadow = true;

                    }
                );


                scene.add(
                    targetModel
                );


                // ====================================================
                // ct1アニメーション
                // ====================================================

                if (
                    gltf.animations &&
                    gltf.animations.length > 0
                ) {

                    mixer =
                        new THREE.AnimationMixer(
                            targetModel
                        );

                    gltf.animations.forEach(
                        (clip) => {

                            const animationName =
                                clip.name
                                    .trim()
                                    .toLowerCase();

                            if (
                                animationName === 'idle' ||
                                animationName === 'dash' ||
                                animationName === 'title'
                            ) {

                                const action =
                                    mixer.clipAction(
                                        clip
                                    );

                                action.setLoop(
                                    THREE.LoopRepeat,
                                    Infinity
                                );

                                action.clampWhenFinished =
                                    false;

                                actions[
                                    animationName
                                ] = action;
                            }
                        }
                    );

                    setAction(
                        actions.title
                            ? 'title'
                            : 'idle'
                    );
                }


                // START前なので、
                // 左にずらしたカメラ位置になる
                updateCameraPosition();

                // ct1の右側にcat.glbを配置する
                loadCatModel();

            },

            undefined,

            function (error) {

                console.error(
                    'ct1.glb の読み込みエラー:',
                    error
                );
            }
        );
    }


    // ============================================================
    // catモデル
    // ============================================================

    function loadCatModel() {

        loader.load(
            './cat.glb',

            function (gltf) {

                catModel =
                    gltf.scene;

                // ct1の正面方向を基準に「右」方向を求める
                const ctForwardDir =
                    new THREE.Vector3(
                        0,
                        0,
                        modelForwardSign
                    ).applyQuaternion(
                        targetModel.quaternion
                    );

                const ctRightDir =
                    new THREE.Vector3()
                        .crossVectors(
                            ctForwardDir,
                            new THREE.Vector3(0, 1, 0)
                        )
                        .normalize();

                catModel.position
                    .copy(
                        targetModel.position
                    )
                    .add(
                        ctRightDir.multiplyScalar(
                            catOffsetFromCt
                        )
                    );

                catModel.position.y +=
                    catHeightOffset;


                catModel.traverse(
                    (child) => {

                        if (!child.isMesh) {
                            return;
                        }

                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                );


                scene.add(
                    catModel
                );


                // ====================================================
                // catアニメーション（ループ再生）
                // ====================================================

                if (
                    gltf.animations &&
                    gltf.animations.length > 0
                ) {

                    catMixer =
                        new THREE.AnimationMixer(
                            catModel
                        );

                    const catAction =
                        catMixer.clipAction(
                            gltf.animations[0]
                        );

                    catAction.setLoop(
                        THREE.LoopRepeat,
                        Infinity
                    );

                    catAction.play();
                }

            },

            undefined,

            function (error) {

                console.error(
                    'cat.glb の読み込みエラー:',
                    error
                );
            }
        );
    }


    // ============================================================
    // ct1 アニメーション切り替え
    // ============================================================

    function setAction(name) {

        if (
            !mixer ||
            !actions[name]
        ) {
            return;
        }

        const nextAction =
            actions[name];

        if (
            currentAction !== nextAction
        ) {

            if (currentAction) {
                currentAction.fadeOut(0.2);
            }

            nextAction
                .reset()
                .play();

            currentAction =
                nextAction;
        }
    }


    // ============================================================
    // 入力状態
    // ============================================================

    function hasMoveInput() {

        return (
            joystickX !== 0 ||
            joystickY !== 0 ||
            keyState.up ||
            keyState.down ||
            keyState.left ||
            keyState.right
        );
    }


    // ============================================================
    // カメラ位置
    // ============================================================

    function updateCameraPosition() {

        if (!targetModel) return;

        const targetPosition =
            targetModel.position
                .clone()
                .add(
                    new THREE.Vector3(
                        0,
                        targetHeightOffset,
                        0
                    )
                );

        let offset =
            new THREE.Vector3()
                .setFromSpherical(
                    cameraSpherical
                );


        // ========================================================
        // START前だけカメラをct1の左側へ移動
        // ========================================================

        if (!gameStarted) {

            // ct1の正面（顔が見える向き）に
            // カメラを配置する
            const forwardDir =
                new THREE.Vector3(0, 0, modelForwardSign)
                    .applyQuaternion(
                        targetModel.quaternion
                    );

            // 通常カメラと同じ上下角度(phi)を維持しつつ、
            // 水平方向はct1の正面方向を基準にする
            const verticalOffset =
                titleCameraDistance *
                Math.cos(cameraSpherical.phi);

            const horizontalDistance =
                titleCameraDistance *
                Math.sin(cameraSpherical.phi);

            offset
                .copy(forwardDir)
                .multiplyScalar(
                    horizontalDistance
                );

            offset.y = verticalOffset;

            camera.position
                .copy(targetPosition)
                .add(offset);

            // カメラの位置は動かさず、
            // 見る先（注視点）だけを指定分下げる
            const titleLookAtPosition =
                targetPosition.clone();

            titleLookAtPosition.y -=
                titleLookAtDrop;

            // ct1を真正面から見る向き（回転させない）を
            // 先に確定させておく
            const straightViewDirection =
                titleLookAtPosition.clone()
                    .sub(camera.position)
                    .normalize();

            // 画面上でct1を右寄りに見せるため、
            // カメラの向きは変えずに位置だけを
            // 左へ平行移動させる（レンズシフトと同じ考え方）
            const cameraRight =
                new THREE.Vector3()
                    .crossVectors(
                        straightViewDirection,
                        new THREE.Vector3(0, 1, 0)
                    )
                    .normalize();

            camera.position.sub(
                cameraRight.multiplyScalar(
                    titleRightEdgeOffset
                )
            );

            camera.lookAt(
                camera.position.clone()
                    .add(straightViewDirection)
            );

            return;

        } else {

            // START後は通常位置
            camera.position
                .copy(targetPosition)
                .add(offset);
        }


        camera.lookAt(
            targetPosition
        );
    }


    // ============================================================
    // アナログスティック
    // ============================================================

    const joystickContainer =
        document.getElementById(
            'joystick-container'
        );

    const joystickStick =
        document.getElementById(
            'joystick-stick'
        );

    let joystickPointerId = null;

    let joystickX = 0;
    let joystickY = 0;

    const joystickRadius = 52;

    const joystickDeadZone = 0.08;


    function updateJoystick(
        clientX,
        clientY
    ) {

        const rect =
            joystickContainer
                .getBoundingClientRect();

        const centerX =
            rect.left +
            rect.width / 2;

        const centerY =
            rect.top +
            rect.height / 2;

        let dx =
            clientX - centerX;

        let dy =
            clientY - centerY;

        const distance =
            Math.hypot(dx, dy);

        if (
            distance > joystickRadius
        ) {

            dx =
                dx /
                distance *
                joystickRadius;

            dy =
                dy /
                distance *
                joystickRadius;
        }


        // スティック表示を左に90度回転

        const displayX = dy;
        const displayY = -dx;

        joystickStick.style.transform =
            `translate(${displayX}px, ${displayY}px)`;


        // ゲーム内移動も同じ向き

        const rawJoystickX =
            dx / joystickRadius;

        const rawJoystickY =
            dy / joystickRadius;

        joystickX =
            rawJoystickY;

        joystickY =
            -rawJoystickX;


        const normalizedDistance =
            Math.hypot(
                joystickX,
                joystickY
            );

        if (
            normalizedDistance <
            joystickDeadZone
        ) {

            joystickX = 0;
            joystickY = 0;
        }
    }


    function resetJoystick() {

        joystickPointerId = null;

        joystickX = 0;
        joystickY = 0;

        joystickStick.style.transform =
            'translate(0px, 0px)';
    }


    function handleJoystickStart(e) {

        if (!gameStarted) return;

        e.preventDefault();
        e.stopPropagation();

        if (
            joystickPointerId !== null
        ) {
            return;
        }

        joystickPointerId =
            e.pointerId;

        try {

            joystickContainer
                .setPointerCapture(
                    e.pointerId
                );

        } catch (err) {}

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }


    function handleJoystickMove(e) {

        if (
            e.pointerId !==
            joystickPointerId
        ) {
            return;
        }

        e.preventDefault();
        e.stopPropagation();

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }


    function handleJoystickEnd(e) {

        if (
            e.pointerId !==
            joystickPointerId
        ) {
            return;
        }

        e.preventDefault();
        e.stopPropagation();

        try {

            if (
                joystickContainer
                    .hasPointerCapture(
                        e.pointerId
                    )
            ) {

                joystickContainer
                    .releasePointerCapture(
                        e.pointerId
                    );
            }

        } catch (err) {}

        resetJoystick();
    }


    joystickContainer.addEventListener(
        'pointerdown',
        handleJoystickStart,
        { passive: false }
    );

    joystickContainer.addEventListener(
        'pointermove',
        handleJoystickMove,
        { passive: false }
    );

    joystickContainer.addEventListener(
        'pointerup',
        handleJoystickEnd,
        { passive: false }
    );

    joystickContainer.addEventListener(
        'pointercancel',
        handleJoystickEnd,
        { passive: false }
    );


    // ============================================================
    // キーボード
    // ============================================================

    const keyState = {
        up: false,
        down: false,
        left: false,
        right: false
    };


    window.addEventListener(
        'keydown',
        (e) => {

            if (!gameStarted) return;

            if (
                e.key === 'ArrowUp' ||
                e.key === 'w'
            ) {
                keyState.up = true;
            }

            if (
                e.key === 'ArrowDown' ||
                e.key === 's'
            ) {
                keyState.down = true;
            }

            if (
                e.key === 'ArrowLeft' ||
                e.key === 'a'
            ) {
                keyState.left = true;
            }

            if (
                e.key === 'ArrowRight' ||
                e.key === 'd'
            ) {
                keyState.right = true;
            }

        }
    );


    window.addEventListener(
        'keyup',
        (e) => {

            if (
                e.key === 'ArrowUp' ||
                e.key === 'w'
            ) {
                keyState.up = false;
            }

            if (
                e.key === 'ArrowDown' ||
                e.key === 's'
            ) {
                keyState.down = false;
            }

            if (
                e.key === 'ArrowLeft' ||
                e.key === 'a'
            ) {
                keyState.left = false;
            }

            if (
                e.key === 'ArrowRight' ||
                e.key === 'd'
            ) {
                keyState.right = false;
            }

        }
    );


    // ============================================================
    // カメラ操作
    // ============================================================

    let isCameraDragging = false;

    let cameraPointerId = null;

    let previousTouchX = 0;
    let previousTouchY = 0;


    function handleRightScreenStart(e) {

        if (!gameStarted) return;

        if (
            e.target.closest(
                '#joystick-container'
            )
        ) {
            return;
        }

        if (isCameraDragging) return;


        if (
            getLogicalX(
                e.clientX,
                e.clientY
            ) >=
            getLogicalWidth() / 2
        ) {

            e.preventDefault();

            isCameraDragging = true;

            cameraPointerId =
                e.pointerId;

            previousTouchX =
                getLogicalX(
                    e.clientX,
                    e.clientY
                );

            previousTouchY =
                getLogicalY(
                    e.clientX,
                    e.clientY
                );

            try {

                renderer.domElement
                    .setPointerCapture(
                        e.pointerId
                    );

            } catch (err) {}
        }
    }


    function handleRightScreenMove(e) {

        if (!isCameraDragging) return;

        if (
            e.pointerId !==
            cameraPointerId
        ) {
            return;
        }

        e.preventDefault();

        const currentLogicalX =
            getLogicalX(
                e.clientX,
                e.clientY
            );

        const currentLogicalY =
            getLogicalY(
                e.clientX,
                e.clientY
            );

        const deltaX =
            currentLogicalX -
            previousTouchX;

        const deltaY =
            currentLogicalY -
            previousTouchY;

        cameraSpherical.theta -=
            deltaX *
            cameraTouchSensitivity;

        cameraSpherical.phi -=
            deltaY *
            cameraTouchSensitivity;

        cameraSpherical.phi =
            Math.max(
                minPolarAngle,
                Math.min(
                    maxPolarAngle,
                    cameraSpherical.phi
                )
            );

        previousTouchX =
            currentLogicalX;

        previousTouchY =
            currentLogicalY;
    }


    function handleRightScreenEnd(e) {

        if (!isCameraDragging) {
            return;
        }

        if (
            e.pointerId !==
            cameraPointerId
        ) {
            return;
        }

        e.preventDefault();

        isCameraDragging = false;

        try {

            if (
                renderer.domElement
                    .hasPointerCapture(
                        e.pointerId
                    )
            ) {

                renderer.domElement
                    .releasePointerCapture(
                        e.pointerId
                    );
            }

        } catch (err) {}

        cameraPointerId = null;
    }


    window.addEventListener(
        'pointerdown',
        handleRightScreenStart,
        { passive: false }
    );

    window.addEventListener(
        'pointermove',
        handleRightScreenMove,
        { passive: false }
    );

    window.addEventListener(
        'pointerup',
        handleRightScreenEnd,
        { passive: false }
    );

    window.addEventListener(
        'pointercancel',
        handleRightScreenEnd,
        { passive: false }
    );


    // ============================================================
    // ct1移動
    // ============================================================

    function updateModelMovement(delta) {

        if (!targetModel) return;

        if (!gameStarted) return;

        let moveX = joystickX;
        let moveY = joystickY;

        let currentSpeed = 0;

        let keyboardX = 0;
        let keyboardY = 0;


        if (keyState.right) {
            keyboardX += 1;
        }

        if (keyState.left) {
            keyboardX -= 1;
        }

        if (keyState.up) {
            keyboardY -= 1;
        }

        if (keyState.down) {
            keyboardY += 1;
        }


        if (
            keyboardX !== 0 ||
            keyboardY !== 0
        ) {

            const length =
                Math.hypot(
                    keyboardX,
                    keyboardY
                );

            moveX =
                keyboardX / length;

            moveY =
                keyboardY / length;

            currentSpeed =
                maxMoveSpeed;

        } else {

            currentSpeed =
                (
                    moveX !== 0 ||
                    moveY !== 0
                )
                    ? maxMoveSpeed
                    : 0;
        }


        const isMoving =
            currentSpeed > 0;


        if (isMoving) {

            if (actions.dash) {
                setAction('dash');
            }

        } else {

            if (actions.idle) {
                setAction('idle');
            }
        }


        if (isMoving) {

            const cameraForward =
                new THREE.Vector3();

            camera.getWorldDirection(
                cameraForward
            );

            cameraForward.y = 0;

            cameraForward.normalize();


            const cameraRight =
                new THREE.Vector3();

            cameraRight.crossVectors(
                cameraForward,
                new THREE.Vector3(
                    0,
                    1,
                    0
                )
            ).normalize();


            const moveDirection =
                new THREE.Vector3();

            moveDirection
                .addScaledVector(
                    cameraRight,
                    moveX
                )
                .addScaledVector(
                    cameraForward,
                    -moveY
                );


            if (
                moveDirection.lengthSq() > 0
            ) {
                moveDirection.normalize();
            }


            const moveDistance =
                currentSpeed * delta;


            const proposedX =
                targetModel.position.x +
                moveDirection.x *
                moveDistance;

            const proposedZ =
                targetModel.position.z +
                moveDirection.z *
                moveDistance;


            const groundHit =
                probeGroundHeight(
                    proposedX,
                    proposedZ,
                    targetModel.position.y
                );


            let canMove = true;


            if (!groundHit) {

                canMove = false;

            } else if (
                isTooSteep(groundHit)
            ) {

                canMove = false;

            } else if (
                Math.abs(
                    groundHit.point.y -
                    targetModel.position.y
                ) > maxStepHeight
            ) {

                canMove = false;
            }


            if (canMove) {

                targetModel.position.x =
                    proposedX;

                targetModel.position.z =
                    proposedZ;
            }


            const targetAngle =
                Math.atan2(
                    moveDirection.x,
                    moveDirection.z
                );


            const targetQuaternion =
                new THREE.Quaternion();

            targetQuaternion.setFromAxisAngle(
                new THREE.Vector3(
                    0,
                    1,
                    0
                ),
                targetAngle
            );


            targetModel.quaternion.slerp(
                targetQuaternion,
                rotationSpeed * delta
            );
        }
    }


    // ============================================================
    // メインループ
    // ============================================================

    function animate() {

        requestAnimationFrame(
            animate
        );

        if (isRendererContextLost) {
            return;
        }

        const delta =
            clock.getDelta();


        updateModelMovement(delta);


        if (mixer) {
            mixer.update(delta);
        }

        if (catMixer) {
            catMixer.update(delta);
        }


        updateGroundCollision();


        // START後だけカメラをct1へ追従
        if (gameStarted) {
            updateCameraPosition();
        }


        updateBgFrustumCulling();


        renderer.setRenderTarget(null);

        renderer.render(
            scene,
            camera
        );


        if (
            posterizeCtx &&
            posterizeCanvas
        ) {

            posterizeCtx.drawImage(
                renderer.domElement,
                0,
                0
            );


            const imageData =
                posterizeCtx.getImageData(
                    0,
                    0,
                    posterizeCanvas.width,
                    posterizeCanvas.height
                );


            const data =
                imageData.data;

            const levels = 9;

            const step =
                255 /
                (levels - 1);


            for (
                let i = 0;
                i < data.length;
                i += 4
            ) {

                data[i] =
                    Math.round(
                        Math.round(
                            data[i] / step
                        ) * step
                    );

                data[i + 1] =
                    Math.round(
                        Math.round(
                            data[i + 1] / step
                        ) * step
                    );

                data[i + 2] =
                    Math.round(
                        Math.round(
                            data[i + 2] / step
                        ) * step
                    );
            }


            posterizeCtx.putImageData(
                imageData,
                0,
                0
            );
        }
    }


    animate();


    // ============================================================
    // リサイズ
    // ============================================================

    window.addEventListener(
        'resize',
        () => {

            updateForceRotateClass();

            camera.aspect =
                getLogicalWidth() /
                getLogicalHeight();

            camera.updateProjectionMatrix();

            applyPixelatedRendererSize();
        }
    );


    window.addEventListener(
        'orientationchange',
        () => {

            updateForceRotateClass();

            camera.aspect =
                getLogicalWidth() /
                getLogicalHeight();

            camera.updateProjectionMatrix();

            applyPixelatedRendererSize();
        }
    );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer - Move & Camera Only</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #1a1a1a;
        touch-action: none;
    }
    #app-stage {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        transform-origin: left top;
        z-index: 1;
    }
    body.force-rotate #app-stage {
        top: 0;
        left: 100%;
        width: 100vh;
        height: 100vw;
        transform: rotate(90deg);
    }
    #canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }
    #canvas-container canvas {
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
    }
    #joystick-container {
        position: absolute;
        left: 30px;
        bottom: 30px;
        width: 150px;
        height: 150px;
        z-index: 20;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        display: none;
    }
    #joystick-base {
        position: absolute;
        left: 0;
        top: 0;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.35);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #joystick-stick {
        position: absolute;
        left: 52px;
        top: 52px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.65);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
        transform: translate(0px, 0px);
    }
    #title-image {
        width: min(135vw, 1500px);
        height: auto;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
    }

    #title-bgm {
        display: none;
    }

    #start-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 50;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 5%;
        transition: opacity 0.5s ease;
        opacity: 1;
        pointer-events: none;
    }
    #start-screen.is-hidden {
        opacity: 0;
        pointer-events: none;
    }

    #intro-fade {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
    }

    #intro-fade.is-black {
        opacity: 1;
    }

    #intro-command {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-family: 'Press Start 2P', 'MS Gothic', monospace;
        font-size: clamp(10px, 1.45vw, 18px);
        line-height: 1.9;
        letter-spacing: 0.02em;
        pointer-events: none;
    }

    #intro-processing {
        white-space: nowrap;
    }

    #intro-log {
        display: none;
        width: min(90vw, 1000px);
        text-align: left;
        white-space: pre-wrap;
    }
    #start-button,
    #chapter-button {
        margin-top: 24px;
        padding: 0;
        background: transparent;
        border: none;
        color: #ffffff;
        font-family: 'Press Start 2P', 'MS Gothic', monospace;
        font-size: 20px;
        letter-spacing: 0.1em;
        text-shadow: 3px 3px 0 #000;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        pointer-events: auto;
        animation: start-button-blink 1s steps(1, end) infinite;
    }
    #chapter-button {
        margin-top: 16px;
    }
    #start-button:active,
    #chapter-button:active {
        transform: scale(0.95);
    }
    @keyframes start-button-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.35; }
    }

    #objective-big {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffffff;
        font-family: 'Press Start 2P', 'MS Gothic', monospace;
        font-size: clamp(22px, 6vw, 60px);
        letter-spacing: 0.08em;
        text-shadow: 4px 4px 0 #000;
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
        text-align: center;
        white-space: nowrap;
    }
    #objective-big.is-visible {
        opacity: 1;
    }

    #objective-small {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #ffffff;
        font-family: 'Press Start 2P', 'MS Gothic', monospace;
        font-size: 14px;
        letter-spacing: 0.05em;
        text-shadow: 2px 2px 0 #000;
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
    }
    #objective-small.is-visible {
        opacity: 1;
    }

    #ct-coords {
        position: absolute;
        top: 20px;
        right: 20px;
        color: #ffffff;
        font-family: 'Press Start 2P', 'MS Gothic', monospace;
        font-size: 12px;
        line-height: 1.6;
        letter-spacing: 0.03em;
        text-shadow: 2px 2px 0 #000;
        z-index: 40;
        pointer-events: none;
        text-align: right;
        white-space: pre;
    }

    .interact-label {
        position: absolute;
        color: #ffffff;
        font-family: 'Press Start 2P', 'MS Gothic', monospace;
        font-size: 14px;
        letter-spacing: 0.05em;
        text-shadow: 2px 2px 0 #000;
        z-index: 35;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
        white-space: nowrap;

        /* è¡¨ç¤ºæå­ããããªãåºãã¿ããé åã«ãã */
        padding: 18px 28px;
        min-width: 120px;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;

        /* åã®è¡¨ç¤ºä½ç½®ãä¸­å¿åºæºã«ãã */
        transform: translate(0, -50%);

        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
    }
    .interact-label.is-visible {
        opacity: 1;
        pointer-events: auto;
    }

    #interact-dialog {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 20%;
        min-height: 90px;
        background: rgba(205, 205, 205, 0.55);

    }

    #black-loading-screen {
        position: fixed;

        background: #000000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
    }
    #black-loading-screen.is-visible {
        opacity: 1;
        pointer-events: auto;
    }
</style>

<script>
    // ============================================================
    // ç»é¢ã®åãå¶å¾¡
    // ============================================================

    function isPortraitDevice() {
        return window.innerWidth < window.innerHeight;
    }

    function getLogicalWidth() {
        return isPortraitDevice()
            ? window.innerHeight
            : window.innerWidth;
    }

    function getLogicalHeight() {
        return isPortraitDevice()
            ? window.innerWidth
            : window.innerHeight;
    }

    function getLogicalX(clientX, clientY) {
        return isPortraitDevice() ? clientY : clientX;
    }

    function getLogicalY(clientX, clientY) {
        return isPortraitDevice()
            ? window.innerWidth - clientX
            : clientY;
    }

    function updateForceRotateClass() {
        if (isPortraitDevice()) {
            document.body.classList.add('force-rotate');
        } else {
            document.body.classList.remove('force-rotate');
        }
    }

    updateForceRotateClass();


    // ============================================================
    // Three.js åºæ¬è¨­å®
    // ============================================================

    const scene = new THREE.Scene();

    const bgGroup = new THREE.Group();
    scene.add(bgGroup);

    const camera = new THREE.PerspectiveCamera(
        75,
        getLogicalWidth() / getLogicalHeight(),
        0.1,
        1000
    );

    const renderer = new THREE.WebGLRenderer({
        antialias: false,
        powerPreference: 'default',
        failIfMajorPerformanceCaveat: false,
        preserveDrawingBuffer: false
    });


    // ============================================================
    // ãã¯ã»ã«ã¢ã¼ãé¢¨ã¬ã³ããªã³ã°
    // ============================================================

    const pixelationScale = 1.7;

    let posterizeCanvas = null;
    let posterizeCtx = null;

    function applyPixelatedRendererSize() {
        const displayWidth = getLogicalWidth();
        const displayHeight = getLogicalHeight();

        const lowResWidth = Math.max(
            1,
            Math.floor(displayWidth / pixelationScale)
        );

        const lowResHeight = Math.max(
            1,
            Math.floor(displayHeight / pixelationScale)
        );

        renderer.setPixelRatio(1);
        renderer.setSize(lowResWidth, lowResHeight, false);

        if (!posterizeCanvas) {
            posterizeCanvas = document.createElement('canvas');

            posterizeCanvas.style.imageRendering = 'pixelated';
            posterizeCanvas.style.position = 'absolute';
            posterizeCanvas.style.top = '0';
            posterizeCanvas.style.left = '0';

            posterizeCtx = posterizeCanvas.getContext(
                '2d',
                { alpha: false }
            );

            if (!posterizeCtx) {
                console.warn(
                    '2D canvas context could not be created.'
                );
                return;
            }

            posterizeCtx.imageSmoothingEnabled = false;

            document
                .getElementById('canvas-container')
                .appendChild(posterizeCanvas);
        }

        posterizeCanvas.width = lowResWidth;
        posterizeCanvas.height = lowResHeight;

        posterizeCanvas.style.width =
            displayWidth + 'px';

        posterizeCanvas.style.height =
            displayHeight + 'px';

        posterizeCanvas.style.filter =
            'contrast(1.08) saturate(1.15)';
    }

    applyPixelatedRendererSize();

    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const cappedAnisotropy = Math.min(
        4,
        renderer.capabilities.getMaxAnisotropy()
    );


    // ============================================================
    // å°é¢å½ããå¤å®
    // ============================================================

    const groundRaycaster = new THREE.Raycaster();

    const groundRayDirection =
        new THREE.Vector3(0, -1, 0);

    const groundRayOrigin =
        new THREE.Vector3();

    const groundOffset = 0.0;
    const terrainProbeHeight = 20.0;
    const maxStepHeight = 0.5;

    const maxWalkableSlopeAngle =
        THREE.MathUtils.degToRad(50);

    const upVector =
        new THREE.Vector3(0, 1, 0);


    function probeGroundHeight(x, z, referenceY) {

        if (
            !bgGroup ||
            bgGroup.children.length === 0
        ) {
            return null;
        }

        groundRayOrigin.set(
            x,
            referenceY + terrainProbeHeight,
            z
        );

        groundRaycaster.set(
            groundRayOrigin,
            groundRayDirection
        );

        const hits =
            groundRaycaster.intersectObject(
                bgGroup,
                true
            );

        if (hits.length === 0) {
            return null;
        }

        for (let i = 0; i < hits.length; i++) {

            if (
                hits[i].point.y <=
                referenceY + maxStepHeight
            ) {
                return hits[i];
            }
        }

        return null;
    }


    function isTooSteep(hit) {

        if (!hit || !hit.face) {
            return false;
        }

        const worldNormal =
            hit.face.normal
                .clone()
                .transformDirection(
                    hit.object.matrixWorld
                );

        const slopeAngle =
            worldNormal.angleTo(upVector);

        return slopeAngle >
            maxWalkableSlopeAngle;
    }


    function updateGroundCollision() {

        if (
            !targetModel ||
            !bgGroup ||
            bgGroup.children.length === 0
        ) {
            return;
        }

        const hit =
            probeGroundHeight(
                targetModel.position.x,
                targetModel.position.z,
                targetModel.position.y
            );

        if (!hit) return;

        if (isTooSteep(hit)) return;

        targetModel.position.y =
            hit.point.y + groundOffset;
    }


    // ============================================================
    // ãºã¼ã ç¡å¹å
    // ============================================================

    let lastTouchEndTime = 0;

    document.addEventListener(
        'touchend',
        function (e) {

            const now = Date.now();

            if (
                now - lastTouchEndTime <= 350
            ) {
                e.preventDefault();
            }

            lastTouchEndTime = now;

        },
        { passive: false }
    );

    document.addEventListener(
        'dblclick',
        function (e) {
            e.preventDefault();
        },
        { passive: false }
    );

    document.addEventListener(
        'gesturestart',
        function (e) {
            e.preventDefault();
        }
    );

    document.addEventListener(
        'gesturechange',
        function (e) {
            e.preventDefault();
        }
    );

    document.addEventListener(
        'gestureend',
        function (e) {
            e.preventDefault();
        }
    );

    document.addEventListener(
        'touchmove',
        function (e) {

            if (e.touches.length > 1) {
                e.preventDefault();
            }

        },
        { passive: false }
    );


    // ============================================================
    // WebGLã³ã³ãã­ã¹ãã­ã¹ãå¯¾ç­
    // ============================================================

    let isRendererContextLost = false;

    renderer.domElement.addEventListener(
        'webglcontextlost',
        function (e) {

            e.preventDefault();

            isRendererContextLost = true;

            console.warn(
                'WebGLã³ã³ãã­ã¹ããå¤±ããã¾ãããå¾©å¸°ãå¾æ©ãã¾ãã'
            );

        },
        false
    );

    renderer.domElement.addEventListener(
        'webglcontextrestored',
        function () {

            isRendererContextLost = false;

            if (typeof clock !== 'undefined') {
                clock.getDelta();
            }

            console.info(
                'WebGLã³ã³ãã­ã¹ããå¾©å¸°ãã¾ããã'
            );

        },
        false
    );


    // ============================================================
    // ã©ã¤ã
    // ============================================================

    // å¤ªé½ã®ããã«é ãããå·®ããæãç©ºã®ãããª
    // å¼±ãç°è²ããã£ãåã«ãã
    const ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            0.3
        );

    scene.add(ambientLight);

    const dirLight =
        new THREE.DirectionalLight(
            0xffffff,
            2.6
        );

    dirLight.position.set(
        4,
        6,
        9
    );

    dirLight.castShadow = true;

    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;

    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;

    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;

    dirLight.shadow.bias = -0.0005;

    scene.add(dirLight);


    const fillLight =
        new THREE.DirectionalLight(
            0xffffff,
            1.0
        );

    fillLight.position.set(
        -3,
        2,
        -6
    );

    scene.add(fillLight);


    // ============================================================
    // ç°å¢ããã
    // ============================================================

    const pmremGenerator =
        new THREE.PMREMGenerator(renderer);

    const environmentScene =
        new THREE.Scene();

    environmentScene.background =
        new THREE.Color(0x202020);

    const environmentLight =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2
        );

    environmentScene.add(environmentLight);

    const environmentTarget =
        pmremGenerator.fromScene(
            environmentScene
        );

    scene.environment =
        environmentTarget.texture;


    // ============================================================
    // ã«ã¡ã©è¨­å®
    // ============================================================

    const targetHeightOffset = 1.5;

    const cameraDistance = 1.6;

    // ã¿ã¤ãã«ç»é¢å°ç¨ã®ã«ã¡ã©è·é¢
    // STARTåã ãéå¸¸ããã«ã¡ã©ãå¼ã
    const titleCameraDistance = 1.7;

    // ã¿ã¤ãã«ç»é¢ã§ct1ãç»é¢å³å¯ãã«æ ãããã®
    // æ³¨è¦ç¹ã®ãããéï¼å¤§ããã»ã©å³ç«¯ã«å¯ãï¼
    const titleRightEdgeOffset = 1.3;

    // ã¿ã¤ãã«ç»é¢ã§ct1ãè¦ãæ³¨è¦ç¹ãä¸ããé
    // ï¼ã«ã¡ã©ã®ä½ç½®èªä½ã¯åãããªãï¼
    const titleLookAtDrop = 0.5;

    // ct1ã®ã­ã¼ã«ã«åæ¹è»¸ã®ç¬¦å·ï¼ã¢ãã«ã®åãã«åããã¦èª¿æ´ï¼
    // 1ãªã(0,0,1)ã-1ãªã(0,0,-1)ãæ­£é¢æ¹å
    const modelForwardSign = 1;

    const initialLeftYawOffset =
        Math.PI / 2;

    let cameraSpherical =
        new THREE.Spherical(
            cameraDistance,
            Math.PI / 2.2,
            initialLeftYawOffset
        );

    const minPolarAngle = 0.1;

    const maxPolarAngle =
        Math.PI / 2 - 0.05;


    // ============================================================
    // ã¢ãã«ã»ã¢ãã¡ã¼ã·ã§ã³
    // ============================================================

    let targetModel = null;
    let bgModel = null;
    let catModel = null;

    // å·®ãæ¿ãå¯è½ãªèæ¯ãã¼ãï¼bgti1âbgti2ã®åãæ¿ãç¨ï¼
    let bgti1Scene = null;
    let bgti2Scene = null;

    // ステージ2に配置するbgtido.glb
    let bgtidoScene = null;

    let mixer = null;
    let catMixer = null;

    let actions = {};

    let currentAction = null;

    // ctã®å³å´ã«cat.glbãéç½®ããè·é¢
    const catOffsetFromCt = 2;

    // catã®é«ãèª¿æ´ï¼ãã©ã¹ã§ä¸ããã¤ãã¹ã§ä¸ï¼
    const catHeightOffset = 0.55;

    const animationFPS = 30;

    const clock = new THREE.Clock();


    // ============================================================
    // ã¹ã¿ã¼ãç»é¢
    // ============================================================

    let gameStarted = false;

    // STARTç´å¾ã®æ¼åºä¸­ã¯æä½ãåãä»ããªã
    let introSequenceActive = false;
    let introSequenceStartTime = 0;
    let introFadeStarted = false;
    let introCommandStarted = false;

    const introProcessingElement =
        document.getElementById('intro-processing');
    const introLogElement =
        document.getElementById('intro-log');

    const introCommandLines = [
        'Command confirmed.',
        'Origin: UNKNOWN',
        'Timestamp: UNKNOWN',
        'Location: %ï¼ã|^^##',
        'Execution authorization: GRANTED',
        'Enforcement commencing.'
    ];
    const introSecondExplosionTime = 8.0;
    const introProcessingDuration = 5.0;
    const introCommandDuration = 10.0;
    const introAfterglowDuration = 4.0;
    const introEndTime =
        introSecondExplosionTime +
        introProcessingDuration +
        introCommandDuration +
        introAfterglowDuration;

    const startScreenElement =
        document.getElementById(

    function applyIntroShake(elapsed) {
        if (!introSequenceActive || !targetModel) return;

        let amplitude = 0;
        let frequency = 0;

        // STARTãã3ç§å¾ã«å°ãã0.5ç§éæºãã
        if (elapsed >= 3.0 && elapsed < 3.5) {
            amplitude = 0.012;
            frequency = 32;
        // STARTãã8ç§å¾ã«å¤§ãã0.7ç§éæºãã
        } else if (elapsed >= 8.0 && elapsed < 8.7) {
            amplitude = 0.08;
            frequency = 45;
        }

        if (amplitude === 0) return;

        const sx = Math.sin(elapsed * frequency) * amplitude;
        const sy = Math.cos(elapsed * frequency * 1.13) * amplitude * 0.7;
        const sz = Math.sin(elapsed * frequency * 0.83) * amplitude * 0.35;

        const right = new THREE.Vector3()
            .setFromMatrixColumn(camera.matrixWorld, 0)
            .normalize();
        const up = new THREE.Vector3()
            .setFromMatrixColumn(camera.matrixWorld, 1)
            .normalize();
        const forward = new THREE.Vector3()
            .setFromMatrixColumn(camera.matrixWorld, 2)
            .normalize();

        camera.position
            .addScaledVector(right, sx)
            .addScaledVector(up, sy)
            .addScaledVector(forward, sz);
    }

    function setupBgMaterials(bgScene) {

        bgScene.traverse((child) => {

            if (!child.isMesh) return;

            const oldMaterial =
                child.material;

            const materials =
                Array.isArray(oldMaterial)
                    ? oldMaterial
                    : [oldMaterial];

            const newMaterials =
                materials.map((material) => {

                    if (material.map) {

                        material.map.encoding =
                            THREE.sRGBEncoding;

                        material.map.anisotropy =
                            cappedAnisotropy;

                        material.map.needsUpdate =
                            true;
                    }

                    return new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        wireframe: false,
                        transparent: true,
                        opacity: 0.99,
                        map: material.map || null,
                        vertexColors:
                            material.vertexColors,
                        side: THREE.DoubleSide
                    });

                });

            child.material =
                Array.isArray(oldMaterial)
                    ? newMaterials
                    : newMaterials[0];

            child.receiveShadow = true;

            child.frustumCulled = true;

            if (child.geometry) {

                if (!child.geometry.boundingSphere) {
                    child.geometry.computeBoundingSphere();
                }

                if (!child.geometry.boundingBox) {
                    child.geometry.computeBoundingBox();
                }
            }

        });
    }

    const bgCullingParts = [];

    const bgCullingFrustum =
        new THREE.Frustum();

    const bgCullingProjScreenMatrix =
        new THREE.Matrix4();

    const bgCullingMargin = 2.0;


    function registerBgCullingPart(
        partScene
    ) {

        const box =
            new THREE.Box3()
                .setFromObject(
                    partScene
                );

        if (box.isEmpty()) return;

        const sphere =
            new THREE.Sphere();

        box.getBoundingSphere(
            sphere
        );

        sphere.radius +=
            bgCullingMargin;

        bgCullingParts.push({
            object: partScene,
            sphere: sphere
        });
    }

    // èæ¯ãã¼ããã«ãªã³ã°å¯¾è±¡ããå¤ã
    // ï¼partSceneãbgGroupããåãé¤ãéã«ãããã¦å¼ã¶ï¼
    function unregisterBgCullingPart(
        partScene
    ) {

        for (
            let i = bgCullingParts.length - 1;
            i >= 0;
            i--
        ) {

            if (
                bgCullingParts[i].object ===
                partScene
            ) {

                bgCullingParts.splice(i, 1);
            }
        }
    }

    // èæ¯ãã¼ããã·ã¼ã³ã«åºãããå¼ã£è¾¼ãããããã
    // æ¢ã«èª­ã¿è¾¼ãã§ããèæ¯ãä½¿ãåãã¦è¦ãã/é ãããã«ä½¿ã
    // ï¼bgGroupã¸ã®è¿½å ã»åé¤ã¨ã«ãªã³ã°ç»é²ãã¾ã¨ãã¦è¡ãï¼
    function setBgSceneVisible(
        partScene,
        isVisible
    ) {

        if (!partScene) return;

        const isCurrentlyShown =
            bgGroup.children.indexOf(
                partScene
            ) !== -1;

        if (isVisible && !isCurrentlyShown) {

            bgGroup.add(partScene);

            registerBgCullingPart(
                partScene
            );

        } else if (
            !isVisible &&
            isCurrentlyShown
        ) {

            bgGroup.remove(partScene);

            unregisterBgCullingPart(
                partScene
            );
        }
    }


    function updateBgFrustumCulling() {

        if (
            bgCullingParts.length === 0
        ) {
            return;
        }

        bgCullingProjScreenMatrix
            .multiplyMatrices(
                camera.projectionMatrix,
                camera.matrixWorldInverse
            );

        bgCullingFrustum
            .setFromProjectionMatrix(
                bgCullingProjScreenMatrix
            );

        for (
            let i = 0;
            i < bgCullingParts.length;
            i++
        ) {

            const part =
                bgCullingParts[i];

            part.object.visible =
                bgCullingFrustum
                    .intersectsSphere(
                        part.sphere
                    );
        }
    }

    function setAction(name) {

        if (
            !mixer ||
            !actions[name]
        ) {
            return;
        }

        const nextAction =
            actions[name];

        if (
            currentAction !== nextAction
        ) {

            if (currentAction) {
                currentAction.fadeOut(0.2);
            }

            nextAction
                .reset()
                .play();

            currentAction =
                nextAction;
        }
    }

    function updateCameraPosition() {

    const joystickRadius = 52;

    const joystickDeadZone = 0.08;


    function updateJoystick(
        clientX,
        clientY
    ) {

        const rect =
            joystickContainer
                .getBoundingClientRect();

        const centerX =
            rect.left +
            rect.width / 2;

        const centerY =
            rect.top +
            rect.height / 2;

        let dx =
            clientX - centerX;

        let dy =
            clientY - centerY;

        const distance =
            Math.hypot(dx, dy);

        if (
            distance > joystickRadius
        ) {

            dx =
                dx /
                distance *
                joystickRadius;

            dy =
                dy /
                distance *
                joystickRadius;
        }


        // ã¹ãã£ãã¯è¡¨ç¤ºãå·¦ã«90åº¦åè»¢

        const displayX = dy;
        const displayY = -dx;

        joystickStick.style.transform =
            `translate(${displayX}px, ${displayY}px)`;


        // ã²ã¼ã åç§»åãåãåã

        const rawJoystickX =
            dx / joystickRadius;

        const rawJoystickY =
            dy / joystickRadius;

        joystickX =
            rawJoystickY;

        joystickY =
            -rawJoystickX;


        const normalizedDistance =
            Math.hypot(
                joystickX,
                joystickY
            );

        if (
            normalizedDistance <
            joystickDeadZone
        ) {

            joystickX = 0;
            joystickY = 0;
        }
    }

            getLogicalX(

        const deltaX =

            currentLogicalY -

        cameraSpherical.theta -=
            deltaX *

        cameraSpherical.phi =
            Math.max(
                minPolarAngle,

                    cameraSpherical.phi
                )
            );

        previousTouchX =
            currentLogicalX;

        previousTouchY =

    function updateModelMovement(delta) {

        if (!targetModel) return;

        if (!gameStarted) return;

        if (interactDialogState !== 'hidden') return;

        let moveX = joystickX;
        let moveY = joystickY;

        let currentSpeed = 0;

        let keyboardX = 0;
        let keyboardY = 0;


        if (keyState.right) {
            keyboardX += 1;
        }

        if (keyState.left) {
            keyboardX -= 1;
        }

        if (keyState.up) {
            keyboardY -= 1;
        }

        if (keyState.down) {
            keyboardY += 1;
        }


        if (
            keyboardX !== 0 ||
            keyboardY !== 0
        ) {

            const length =
                Math.hypot(
                    keyboardX,
                    keyboardY
                );

            moveX =
                keyboardX / length;

            moveY =
                keyboardY / length;

            currentSpeed =
                maxMoveSpeed;

        } else {

            currentSpeed =
                (
                    moveX !== 0 ||
                    moveY !== 0
                )
                    ? maxMoveSpeed
                    : 0;
        }


        const isMoving =
            currentSpeed > 0;


        if (isMoving) {

            if (actions.dash) {
                setAction('dash');
            }

        } else {

            if (actions.idle) {
                setAction('idle');
            }
        }


        if (isMoving) {

            const cameraForward =
                new THREE.Vector3();

            camera.getWorldDirection(
                cameraForward
            );

            cameraForward.y = 0;

            cameraForward.normalize();


            const cameraRight =
                new THREE.Vector3();

            cameraRight.crossVectors(
                cameraForward,
                new THREE.Vector3(
                    0,
                    1,
                    0
                )
            ).normalize();


            const moveDirection =
                new THREE.Vector3();

            moveDirection
                .addScaledVector(
                    cameraRight,
                    moveX
                )
                .addScaledVector(
                    cameraForward,
                    -moveY
                );


            if (
                moveDirection.lengthSq() > 0
            ) {
                moveDirection.normalize();
            }


            const moveDistance =
                currentSpeed * delta;


            const proposedX =
                targetModel.position.x +
                moveDirection.x *
                moveDistance;

            const proposedZ =
                targetModel.position.z +
                moveDirection.z *
                moveDistance;


            const groundHit =
                probeGroundHeight(
                    proposedX,
                    proposedZ,
                    targetModel.position.y
                );


            let canMove = true;


            if (!groundHit) {

                canMove = false;

            } else if (
                isTooSteep(groundHit)
            ) {

                canMove = false;

            } else if (
                Math.abs(
                    groundHit.point.y -
                    targetModel.position.y
                ) > maxStepHeight
            ) {

                canMove = false;
            }


            if (canMove) {

                targetModel.position.x =
                    proposedX;

                targetModel.position.z =
                    proposedZ;
            }


            const targetAngle =
                Math.atan2(
                    moveDirection.x,
                    moveDirection.z
                );


            const targetQuaternion =
                new THREE.Quaternion();

            targetQuaternion.setFromAxisAngle(
                new THREE.Vector3(
                    0,
                    1,
                    0
                ),
                targetAngle
            );


            targetModel.quaternion.slerp(
                targetQuaternion,
                rotationSpeed * delta
            );
        }
    }

        );

        marker.userData.baseY = baseY;

        // è·é¢å¤å®ã¯å°é¢åº§æ¨ï¼æµ®éãªãã»ãããå«ã¾ãªãç¹ï¼ã§è¡ã
        marker.userData.anchor =
            new THREE.Vector3(x, groundY, z);

        marker.userData.interactRadius =
            (typeof interactRadius === 'number')
                ? interactRadius
                : defaultInteractRadius;

        marker.userData.interactText =
            interactText || defaultInteractText;

        // ãã®ãã¼ã«ã¼ãæ¼ããã¨ãã®å¦çã
        // çç¥æã¯ãit's unusable.ãã®ãã¤ã¢ã­ã°ãéãã
        marker.userData.onInteract =
            (typeof onInteract === 'function')
                ? onInteract
                : function () {
                    openInteractDialog();
                };

        scene.add(marker);

        // è¿ã¥ããã¨ãã«åºããinteractãã©ãã«ãç¨æãã¦ãã
        const label =
            document.createElement('div');

        label.className = 'interact-label';
        label.textContent =
            marker.userData.interactText;

        // ã©ãã«ãã¿ãã/ã¯ãªãã¯ããããã¤ã¢ã­ã°ãéã
        label.addEventListener(
            'pointerdown',
            function (e) {

                if (
                    !label.classList.contains(
                        'is-visible'
                    )
                ) {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();

                marker.userData.onInteract();
            },
            { passive: false }
        );

        if (appStageElement) {
            appStageElement.appendChild(label);
        }

        marker.userData.label = label;

        floatingMarkers.push(marker);

        return marker;
    }

    // ã¯ã¼ã«ãåº§æ¨ãapp-stageåã®ã­ã¸ã«ã«ãªã¹ã¯ãªã¼ã³åº§æ¨ã«å¤æãã
    // ï¼ç»é¢åè»¢ã»ãã¯ã»ã«åã«é¢ããããjoystickç­ã¨åãåº§æ¨ç³»ã«ãªãï¼
    function worldToLogicalScreen(worldPosition) {

        const ndc =
            worldPosition.clone().project(camera);

        const logicalWidth = getLogicalWidth();
        const logicalHeight = getLogicalHeight();

        return {
            x: (ndc.x + 1) / 2 * logicalWidth,
            y: (1 - (ndc.y + 1) / 2) * logicalHeight,
            behindCamera: ndc.z > 1
        };
    }

    // ãã¬ã¤ã¤ã¼ã¨ã®è·é¢ãè¦ã¦ãinteractã©ãã«ã®
    // è¡¨ç¤ºã»éè¡¨ç¤ºã¨ç»é¢ä¸ã®ä½ç½®ãæ´æ°ãã
    function updateMarkerInteractLabel(marker) {

        const label = marker.userData.label;

        if (!label) return;

        // ãã¤ã¢ã­ã°è¡¨ç¤ºä¸­ã¯ã©ãã«ãåºããªã
        if (interactDialogState !== 'hidden') {
            label.classList.remove('is-visible');
            return;
        }

        if (!targetModel) {
            label.classList.remove('is-visible');
            return;
        }

        const distance =
            targetModel.position.distanceTo(
                marker.userData.anchor
            );

        if (distance > marker.userData.interactRadius) {
            label.classList.remove('is-visible');
            return;
        }

        const screenPos =
            worldToLogicalScreen(
                marker.position
            );

        if (screenPos.behindCamera) {
            label.classList.remove('is-visible');
            return;
        }

        label.style.left =
            (screenPos.x + interactLabelOffsetX) + 'px';

        label.style.top =
            screenPos.y + 'px';

        label.classList.add('is-visible');
    }

    // æµ®éãã¼ã«ã¼ããµããµãä¸ä¸ã«æºãããªãã
    // ãã£ããåè»¢ãããinteractã©ãã«ãæ´æ°ãã
    function updateFloatingMarkers(
        elapsedSeconds
    ) {

        for (
            let i = 0;
            i < floatingMarkers.length;
            i++
        ) {

            const marker =
                floatingMarkers[i];

            marker.position.y =
                marker.userData.baseY +
                Math.sin(
                    elapsedSeconds * 2.0
                ) * 0.08;

            marker.rotation.y += 0.02;

            updateMarkerInteractLabel(
                marker
            );
        }
    }

    // å¨ã¦ã®æµ®éãã¼ã«ã¼ãæ¶å»ããï¼3Dãªãã¸ã§ã¯ãã¨ã©ãã«ã®ä¸¡æ¹ï¼ã
    // ããããåãæ¿ããã¨ããªã©ããã¼ã«ã¼æ§æã
    // ã¾ã£ãããªç¶æã«åæåãããã¨ãã«å¼ã¶ã
    function clearFloatingMarkers() {

        for (
            let i = 0;
            i < floatingMarkers.length;
            i++
        ) {

            const marker =
                floatingMarkers[i];

            scene.remove(marker);

            const label =
                marker.userData.label;

            if (
                label &&
                label.parentNode
            ) {

                label.parentNode.removeChild(
                    label
                );
            }
        }

        floatingMarkers.length = 0;
    }


    // ============================================================
    // interactãã¤ã¢ã­ã°ï¼åå©ç¨å¯è½ï¼
    // ä¸é¨ãèãç°è²ã«ãªããæç« ãä¸æå­ãã¤è¡¨ç¤ºããã
    // è¡¨ç¤ºãçµããããç»é¢ã¿ããã§éããã
    // ============================================================

    const interactDialogElement =
        document.getElementById('interact-dialog');

    const interactDialogTextElement =
        document.getElementById('interact-dialog-text');

    // 'hidden' | 'typing' | 'waiting'
    let interactDialogState = 'hidden';

    let interactTypingTimeoutId = null;

    // 1æå­ãããã®è¡¨ç¤ºééï¼ããªç§ï¼
    const interactTypingIntervalMs = 60;

    // message: ä¸æå­ãã¤è¡¨ç¤ºããæç« 
    function openInteractDialog(
        message
    ) {

        if (interactDialogState !== 'hidden') {
            return;
        }

        if (
            !interactDialogElement ||
            !interactDialogTextElement
        ) {
            return;
        }

        const textToType =
            message || "it's unusable.";

        interactDialogState = 'typing';

        interactDialogTextElement.textContent = '';

        interactDialogElement.classList.add(
            'is-visible'
        );

        typeInteractDialogText(
            textToType,
            0
        );
    }

    function typeInteractDialogText(
        fullText,
        index
    ) {

        if (index > fullText.length) {

            interactDialogState = 'waiting';

            return;
        }

        interactDialogTextElement.textContent =
            fullText.slice(0, index);

        interactTypingTimeoutId = setTimeout(
            () => {

                typeInteractDialogText(
                    fullText,
                    index + 1
                );

            },
            interactTypingIntervalMs
        );
    }

    function closeInteractDialog() {

        if (interactTypingTimeoutId) {

            clearTimeout(
                interactTypingTimeoutId
            );

            interactTypingTimeoutId = null;
        }

        interactDialogState = 'hidden';

        if (interactDialogElement) {
            interactDialogElement.classList.remove(
                'is-visible'
            );
        }

        if (interactDialogTextElement) {
            interactDialogTextElement.textContent = '';
        }
    }

    // è¡¨ç¤ºãçµãã£ãå¾ï¼'waiting'ç¶æï¼ã«ç»é¢ã®ã©ããã
    // ã¿ããããããã¤ã¢ã­ã°ãéããã
    // capture: trueã§ãä»ã®æä½ï¼ã«ã¡ã©ã»ã¸ã§ã¤ã¹ãã£ãã¯ï¼ãã
    // åã«ãã®ã¿ãããå¦çãã¦æ¶è²»ããã
    window.addEventListener(
        'pointerdown',
        function (e) {

            if (interactDialogState !== 'waiting') {
                return;
            }

            e.preventDefault();
            e.stopPropagation();

            closeInteractDialog();
        },
        { passive: false, capture: true }
    );


    // ============================================================
    // é»ãã­ã¼ãç»é¢ï¼åå©ç¨å¯è½ï¼
    // ============================================================

    const blackLoadingScreenElement =
        document.getElementById(
            'black-loading-screen'
        );

    // CSSã®transitionæéã¨åãããï¼ããªç§ï¼
    const blackLoadingFadeDurationMs = 500;

    function showBlackLoadingScreen() {

        if (!blackLoadingScreenElement) {
            return;
        }

        blackLoadingScreenElement.classList.add(
            'is-visible'
        );
    }

    function hideBlackLoadingScreen() {

        if (!blackLoadingScreenElement) {
            return;
        }

        blackLoadingScreenElement.classList.remove(
            'is-visible'
        );
    }


    // ============================================================
    // ã¹ãã¼ã¸ãã¨ã®æããï¼åå©ç¨å¯è½ï¼
    // ç½ãé¨åãçºåãã¦è¦ããªããããä¸¡ã¹ãã¼ã¸ã¨ã
    // æ§ãããªæ°å¤ã«ãã¦ããï¼èµ·åæã®åæå¤ã¨åãï¼
    // ============================================================

    const stage1LightSettings = {
        ambient: 0.3,
        dir: 2.6,
        fill: 1.0,
        exposure: 0.95
    };

    const stage2LightSettings = {
        ambient: 0.3,
        dir: 2.6,
        fill: 1.0,
        exposure: 0.95
    };

    function applyStageLightSettings(
        settings
    ) {

        ambientLight.intensity =
            settings.ambient;

        dirLight.intensity =
            settings.dir;

        fillLight.intensity =
            settings.fill;

        renderer.toneMappingExposure =
            settings.exposure;
    }


    // ============================================================
    // ã¹ãã¼ã¸1 â ã¹ãã¼ã¸2 ã®åãæ¿ãï¼åå©ç¨å¯è½ï¼
    // é»ç»é¢ãæãã§èæ¯ã»æããã»ãã¼ã«ã¼ãä¸¸ãã¨å¥ãæ¿ãã
    // ãã¬ã¤ã¤ã¼ãæ°ããåºç¾ä½ç½®ã¸ç§»åãããã
    // ============================================================

    // ç¾å¨ã®ã¹ãã¼ã¸ï¼1 or 2ï¼ãåãæ¿ãä¸­ã®å¤éçºç«é²æ­¢ãå¼ã­ã
    let currentStage = 1;

    function movePlayerTo(
        x,
        z,
        groundY
    ) {

        if (!targetModel) return;

        targetModel.position.x = x;
        targetModel.position.z = z;
        targetModel.position.y = groundY;

        const groundHit =
            probeGroundHeight(
                x,
                z,
                groundY
            );

        if (groundHit) {

            targetModel.position.y =
                groundHit.point.y;
        }
    }

    // ã¹ãã¼ã¸1ã®ãã¼ã«ã¼æ§æ
    function createStage1Markers() {

        createFloatingTriangleMarker(
            -7.2,
            3.8,
            0,
            1.0
        );

        createFloatingTriangleMarker(
            0,
            12.9,
            0,
            1.0
        );

        createFloatingTriangleMarker(
            6.9,
            6.5,
            0,
            1.0
        );

        createFloatingTriangleMarker(
            -6.8,
            13.1,
            8.3,
            1.0,
            defaultInteractRadius,
            defaultInteractText,
            function () {
                goToStage2(-14.3, -3.1, 0);
            }
        );
    }

    // ã¹ãã¼ã¸2ã®ãã¼ã«ã¼æ§æ
    function createStage2Markers() {

        createFloatingTriangleMarker(
            -14.3,
            -3.1,
            0,
            1.0,
            defaultInteractRadius,
            defaultInteractText,
            function () {
                goToStage1(
                    -6.8,
                    13.1,
                    8.3
                );
            }
        );

        // bgtido.glb(-19.9, 0, 75.7)の手前に置くマーカー
        // ※「手前」の向きが実際のモデルの向きと違う場合はzの値を調整してください
        createFloatingTriangleMarker(
            -19.9,
            73.7,
            0,
            1.0
        );
    }

    // bgti2.glbãã¾ã èª­ã¿è¾¼ãã§ããªããã°èª­ã¿è¾¼ã
    // ï¼2åç®ä»¥éã¯èª­ã¿è¾¼ã¿æ¸ã¿ã®ãã®ããã®ã¾ã¾ä½¿ãåãï¼
    function ensureBgti2Loaded(
        onReady
    ) {

        if (bgti2Scene) {
            onReady();
            return;
        }

        loader.load(
            './bgti2.glb',

            function (gltf) {

                try {

                    const partScene =
                        gltf.scene;

                    partScene.scale.set(
                        1,
                        1,
                        1
                    );

                    setupBgMaterials(
                        partScene
                    );

                    bgti2Scene = partScene;

                } catch (setupError) {

                    console.error(
                        'bgti2.glb ã®ã»ããã¢ããã¨ã©ã¼:',
                        setupError
                    );
                }

                onReady();
            },

            undefined,

            function (error) {

                console.error(
                    'bgti2.glb ã®èª­ã¿è¾¼ã¿ã¨ã©ã¼:',
                    error
                );

                onReady();
            }
        );
    }

    // ã¹ãã¼ã¸1 â ã¹ãã¼ã¸2
    // bgtido.glbをまだ読み込んでいなければ読み込む
    // （2回目以降は読み込み済みのものをそのまま使い回す）
    function ensureBgtidoLoaded(
        onReady
    ) {

        if (bgtidoScene) {
            onReady();
            return;
        }

        loader.load(
            './bgtido.glb',

            function (gltf) {

                try {

                    const partScene =
                        gltf.scene;

                    partScene.scale.set(
                        1,
                        1,
                        1
                    );

                    partScene.position.set(
                        -19.9,
                        0,
                        75.7
                    );

                    setupBgMaterials(
                        partScene
                    );

                    bgtidoScene = partScene;

                } catch (setupError) {

                    console.error(
                        'bgtido.glb のセットアップエラー:',
                        setupError
                    );
                }

                onReady();
            },

            undefined,

            function (error) {

                console.error(
                    'bgtido.glb の読み込みエラー:',
                    error
                );

                onReady();
            }
        );
    }

    function goToStage2(
        spawnX,
        spawnZ,
        spawnGroundY
    ) {

        if (currentStage !== 1) return;

        // èª­ã¿è¾¼ã¿ä¸­ãå«ãã¦å¤éçºç«ãé²ã
        currentStage = 2;

        showBlackLoadingScreen();

        setTimeout(
            () => {

                ensureBgti2Loaded(
                    function () {

                        ensureBgtidoLoaded(
                            function () {

                                setBgSceneVisible(
                                    bgti1Scene,
                                    false
                                );

                                setBgSceneVisible(
                                    bgti2Scene,
                                    true
                                );

                                setBgSceneVisible(
                                    bgtidoScene,
                                    true
                                );

                                applyStageLightSettings(
                                    stage2LightSettings
                                );

                                clearFloatingMarkers();
                                createStage2Markers();

                                movePlayerTo(
                                    (typeof spawnX === 'number') ? spawnX : 0,
                                    (typeof spawnZ === 'number') ? spawnZ : 0,
                                    (typeof spawnGroundY === 'number') ? spawnGroundY : 0
                                );

                                hideBlackLoadingScreen();
                            }
                        );
                    }
                );
            },
            blackLoadingFadeDurationMs
        );
    }

    // ã¹ãã¼ã¸2 â ã¹ãã¼ã¸1
    function goToStage1(
        spawnX,
        spawnZ,
        spawnGroundY
    ) {

        if (currentStage !== 2) return;

        currentStage = 1;

        showBlackLoadingScreen();

        setTimeout(
            () => {

                setBgSceneVisible(
                    bgti2Scene,
                    false
                );

                setBgSceneVisible(
                    bgtidoScene,
                    false
                );

                setBgSceneVisible(
                    bgti1Scene,
                    true
                );

                applyStageLightSettings(
                    stage1LightSettings
                );

                clearFloatingMarkers();
                createStage1Markers();

                movePlayerTo(
                    (typeof spawnX === 'number') ? spawnX : -6.8,
                    (typeof spawnZ === 'number') ? spawnZ : 13.1,
                    (typeof spawnGroundY === 'number') ? spawnGroundY : 8.3
                );

                hideBlackLoadingScreen();
            },
            blackLoadingFadeDurationMs
        );
    }

    createStage1Markers();


    // ============================================================
    // ã¡ã¤ã³ã«ã¼ã
    // ============================================================

    function animate() {

        requestAnimationFrame(
            animate
        );

        if (isRendererContextLost) {
            return;
        }

        const delta =
            clock.getDelta();


        updateModelMovement(delta);


        if (mixer) {
            mixer.update(delta);
        }

        if (catMixer) {
            catMixer.update(delta);
        }


        updateGroundCollision();


        // STARTå¾ã ãã«ã¡ã©ãct1ã¸è¿½å¾
        if (gameStarted) {
            updateCameraPosition();
        }

        updateIntroSequence();

        if (introSequenceActive) {
            const introElapsed =
                (performance.now() - introSequenceStartTime) / 1000;
            applyIntroShake(introElapsed);
        }


        updateBgFrustumCulling();

        updateCtCoordsDisplay();

        updateFloatingMarkers(
            performance.now() / 1000
        );


        renderer.setRenderTarget(null);

        renderer.render(
            scene,
            camera
        );


        if (
            posterizeCtx &&
            posterizeCanvas
        ) {

            posterizeCtx.drawImage(
                renderer.domElement,
                0,
                0
            );


            const imageData =
                posterizeCtx.getImageData(
                    0,
                    0,
                    posterizeCanvas.width,
                    posterizeCanvas.height
                );


            const data =
                imageData.data;

            const levels = 9;

            const step =
                255 /
                (levels - 1);


            for (
                let i = 0;
                i < data.length;
                i += 4
            ) {

                data[i] =
                    Math.round(
                        Math.round(
                            data[i] / step
                        ) * step
                    );

                data[i + 1] =
                    Math.round(
                        Math.round(
                            data[i + 1] / step
                        ) * step
                    );

                data[i + 2] =
                    Math.round(
                        Math.round(
                            data[i + 2] / step
                        ) * step
                    );
            }


            posterizeCtx.putImageData(
                imageData,
                0,
                0
            );
        }
    }


    animate();


    // ============================================================
    // ãªãµã¤ãº
    // ============================================================

    window.addEventListener(
        'resize',
        () => {

            updateForceRotateClass();

            camera.aspect =
                getLogicalWidth() /
                getLogicalHeight();

            camera.updateProjectionMatrix();

            applyPixelatedRendererSize();
        }
    );


    window.addEventListener(
        'orientationchange',
        () => {

            updateForceRotateClass();

            camera.aspect =
                getLogicalWidth() /
                getLogicalHeight();

            camera.updateProjectionMatrix();

            applyPixelatedRendererSize();
        }
    );

</script>
